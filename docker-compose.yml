
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quest-dating-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-quest_dating}
      POSTGRES_USER: ${DB_USER:-quest_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
#      - ./database/dump.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest_user -d quest_dating"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quest-dating-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: quest_dating
      DB_USER: ${DB_USER:-quest_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quest-network

  # Frontend Client (Nuxt SSR)
  client:
    build:
      context: ./client-nuxt
      dockerfile: Dockerfile
    container_name: quest-dating-client
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_BASE_INTERNAL: http://server:5000/api
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - server
    networks:
      - quest-network

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  quest-network:
    driver: bridge
