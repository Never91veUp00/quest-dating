version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quest-dating-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quest_dating
      POSTGRES_USER: quest_user
      POSTGRES_PASSWORD: quest_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest_user -d quest_dating"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quest-dating-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: quest_dating
      DB_USER: quest_user
      DB_PASSWORD: quest_password
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quest-network
    command: npm start

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: quest-dating-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - quest-network
    command: npm run dev -- --host

  # Nginx (Production)
  nginx:
    image: nginx:alpine
    container_name: quest-dating-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - quest-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  quest-network:
    driver: bridge