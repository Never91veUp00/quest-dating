version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quest-dating-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-quest_dating}
      POSTGRES_USER: ${DB_USER:-quest_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest_user -d quest_dating"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server (Express)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quest-dating-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: quest_dating
      DB_USER: ${DB_USER:-quest_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://questdating.ru}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quest-network
    command: node src/server.js

  # Frontend Client (Nuxt 4 SSR)
  client:
    build:
      context: ./client-nuxt
      dockerfile: Dockerfile
    container_name: quest-dating-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Внутренний адрес Express для SSR-запросов (server-side fetch)
      NUXT_API_BASE_INTERNAL: http://server:5000/api
      # Публичный адрес API для клиентских запросов (через Nginx /api proxy)
      NUXT_PUBLIC_API_BASE: /api
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - quest-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: quest-dating-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - server
      - client
    networks:
      - quest-network

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  quest-network:
    driver: bridge