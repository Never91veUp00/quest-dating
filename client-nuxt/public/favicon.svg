<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#f0d060"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="120" height="120" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Heart shape -->
  <path d="M60 88
    C60 88 28 68 28 46
    C28 34 36 26 46 26
    C52 26 57 29 60 34
    C63 29 68 26 74 26
    C84 26 92 34 92 46
    C92 68 60 88 60 88Z"
    fill="url(#accent)" filter="url(#glow)" opacity="0.95"/>

  <!-- Route dots inside heart -->
  <circle cx="44" cy="50" r="4" fill="#1a0a2e" opacity="0.7"/>
  <circle cx="60" cy="44" r="4" fill="#1a0a2e" opacity="0.7"/>
  <circle cx="76" cy="50" r="4" fill="#1a0a2e" opacity="0.7"/>

  <!-- Connecting dashed line -->
  <path d="M44 50 Q52 38 60 44 Q68 50 76 50"
    stroke="#1a0a2e" stroke-width="2" fill="none"
    stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Small sparkle top-right -->
  <circle cx="88" cy="22" r="3" fill="url(#accent)" opacity="0.6"/>
  <circle cx="96" cy="30" r="2" fill="url(#accent)" opacity="0.4"/>
  <circle cx="82" cy="16" r="2" fill="url(#accent)" opacity="0.4"/>
</svg>
