<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f2ff"/>
      <stop offset="100%" style="stop-color:#e8eaf6"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Узор точек -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#667eea" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots)"/>

  <!-- Иконка фото -->
  <g transform="translate(400, 260)">
    <!-- Фон иконки -->
    <circle cx="0" cy="0" r="72" fill="url(#icon-grad)"/>
    <!-- Рамка -->
    <rect x="-34" y="-26" width="68" height="52" rx="6" ry="6"
          fill="none" stroke="#667eea" stroke-width="3.5" stroke-opacity="0.6"/>
    <!-- Объектив -->
    <circle cx="0" cy="-2" r="16" fill="none" stroke="#667eea" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="0" cy="-2" r="8" fill="#764ba2" opacity="0.35"/>
    <!-- Вспышка -->
    <rect x="18" y="-22" width="8" height="6" rx="2" fill="#667eea" opacity="0.5"/>
  </g>

  <!-- Текст -->
  <text x="400" y="368" font-size="17" font-family="Arial, sans-serif"
        font-weight="600" fill="#667eea" text-anchor="middle" opacity="0.7">
    Изображение недоступно
  </text>
  <text x="400" y="394" font-size="13" font-family="Arial, sans-serif"
        fill="#764ba2" text-anchor="middle" opacity="0.45">
    Quest Dating
  </text>
</svg>
