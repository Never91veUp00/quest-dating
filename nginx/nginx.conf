# /etc/nginx/sites-available/quest-dating
# (sites-enabled/quest-dating — СИМЛИНК на этот файл, см. задачу 1.4.6)
#
# Production-конфиг nginx для questdating.ru.
# nginx работает на ХОСТЕ (systemd-сервис), не в Docker. См. docs/ARCHITECTURE.md.
#
# ВАЖНО про деплой этого файла:
#   1. Бэкап текущего конфига класть в /tmp/, НЕ в sites-enabled/ и НЕ в
#      sites-available/ (nginx читает ВСЕ файлы из sites-enabled/; бэкап там
#      станет вторым активным конфигом — это уже роняло прод, см. INC-002).
#   2. sudo cp nginx/nginx.conf /etc/nginx/sites-available/quest-dating
#      (enabled — симлинк, правим available, симлинк подхватит автоматически)
#   3. sudo nginx -t  (ОБЯЗАТЕЛЬНО до reload)
#   4. sudo systemctl reload nginx
#
# ── IP-привязка в listen — ОСОЗНАННОЕ РЕШЕНИЕ (задача 1.4.7), НЕ случайность ──
# Слушаем ЯВНО 146.103.111.12 (туда резолвится домен), а НЕ `listen 443` на
# всех интерфейсах. Разбор (1 июня, по факту nginx -T + ip addr):
#   • На ens3 два публичных IP: 146.103.111.12 (DNS-таргет) и 89.124.90.154
#     (мёртвый для домена — именно он дал 502 в INC-002).
#   • Соседний vhost n8n.questdating.ru прибит к 146.103.111.12:443 через
#     `certbot --nginx` (маркеры "managed by Certbot") и будет ре-пиниться
#     на этот IP при каждом renew — его привязку мы не контролируем.
# ⚠️  НЕ менять на `listen 443 ssl` (wildcard) при пиннутом n8n: смесь
#     wildcard- и специфичного сокета на :443 уводит трафик questdating.ru
#     в n8n-блок (более специфичный сокет выигрывает) → чужой сайт/404 на
#     проде. Wildcard потребовал бы и n8n снять с certbot --nginx — лишний
#     риск на работающем сервисе без триггера (один стабильный сервер).
# Инвариант: оба questdating-vhost'а живут на DNS-таргетном IP. При РЕАЛЬНОЙ
# миграции/смене IP — поменять адрес здесь осознанно (это ручное событие).

server {
    listen 146.103.111.12:80;
    server_name questdating.ru www.questdating.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 146.103.111.12:443 ssl http2;
    server_name questdating.ru www.questdating.ru;

    # SSL — Let's Encrypt через certbot
    ssl_certificate /etc/letsencrypt/live/questdating.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/questdating.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2;

    # Trailing slash redirect (SEO: avoid duplicate content)
    # Matches any URL with trailing slash except root /
    location ~ ^(/[^/].*)/$  {
        return 301 $scheme://$host$1;
    }

    # Health check — напрямую к Express backend, минуя Nuxt.
    # Express слушает 5000 в Docker, проброшен на 127.0.0.1:5001 на хосте.
    # Дёргается monitor.sh (cron, каждые 5 мин) и UptimeRobot (план 1.4.3).
    # exact match через '=' — приоритетнее prefix-локаций, матчит только /health.
    location = /health {
        proxy_pass http://127.0.0.1:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Nuxt static assets — content-hashed, cache forever
    location ~* ^/_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Frontend (Nuxt SSR)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Sitemap URLs — обрабатывается Nuxt SSR (Nitro route), НЕ Express
    location = /api/sitemap-urls {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        client_max_body_size 200M;
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads — proxy through Express (has access to Docker volume)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    proxy_hide_header X-Powered-By;
}