# /etc/nginx/sites-available/quest-dating
#
# Активный production-конфиг nginx для questdating.ru.
# На сервере должен лежать как файл (не симлинк) в /etc/nginx/sites-enabled/quest-dating
# — copy, не symlink (исторически так сложилось; см. follow-up задачу 1.4.7).
#
# nginx работает на хосте (systemd-сервис), не в Docker-контейнере.
# См. docs/ARCHITECTURE.md и docs/DEPLOY.md.

server {
    listen 89.124.90.154:80;
    server_name questdating.ru www.questdating.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 89.124.90.154:443 ssl http2;
    server_name questdating.ru www.questdating.ru;

    # SSL: Let's Encrypt через certbot (НЕ "сертификат из панели рег.ру")
    ssl_certificate     /etc/letsencrypt/live/questdating.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/questdating.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Health check — напрямую к Express backend, минуя Nuxt.
    # Express слушает 5000 в Docker, проброшен на 127.0.0.1:5001 на хосте.
    # Дёргается monitor.sh (каждые 5 мин из cron) и UptimeRobot (план 1.4.3).
    # exact match через '=' — без этого блок захватил бы /health/anything.
    location = /health {
        proxy_pass http://127.0.0.1:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Не засорять access.log проверками мониторинга
        access_log off;

        # Принудительно отдавать свежий ответ
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }

    # API — напрямую на Express, минуя Nuxt-прокси
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads — отдаются Express'ом (multer storage)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
    }

    # Frontend (Nuxt SSR) — всё остальное
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
