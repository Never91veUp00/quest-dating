<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#f7f0ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7"/>
      <stop offset="100%" style="stop-color:#d4b896"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="420" rx="24" fill="url(#bgGrad)"/>

  <!-- Floating decorative elements -->
  <!-- Heart top right -->
  <g transform="translate(420, 55)">
    <path d="M20 8 C20 3.6 16.4 0 12 0 C9.8 0 7.8 0.9 6.4 2.4 C5 0.9 3 0 0.8 0 C-3.6 0 -7.2 3.6 -7.2 8 C-7.2 14 0.8 20 6.4 24 C12 20 20 14 20 8Z" fill="#ff6b9d" opacity="0.9" transform="translate(-6, 0)"/>
  </g>

  <!-- Star top left -->
  <g transform="translate(68, 48)" opacity="0.8">
    <polygon points="12,0 15,9 24,9 17,14 19,24 12,18 5,24 7,14 0,9 9,9" fill="#764ba2" opacity="0.6" transform="scale(0.8)"/>
  </g>

  <!-- Small hearts scattered -->
  <circle cx="460" cy="140" r="5" fill="#ff6b9d" opacity="0.4"/>
  <circle cx="72" cy="180" r="4" fill="#667eea" opacity="0.4"/>
  <circle cx="448" cy="300" r="6" fill="#764ba2" opacity="0.3"/>

  <!-- Sparkles -->
  <g transform="translate(390, 90)" opacity="0.7">
    <line x1="8" y1="0" x2="8" y2="16" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="16" y2="8" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(95, 130)" opacity="0.5">
    <line x1="6" y1="0" x2="6" y2="12" stroke="#764ba2" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="12" y2="6" stroke="#764ba2" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Desk -->
  <rect x="80" y="280" width="360" height="18" rx="6" fill="url(#deskGrad)"/>
  <rect x="110" y="296" width="20" height="60" rx="4" fill="#c4a882"/>
  <rect x="390" y="296" width="20" height="60" rx="4" fill="#c4a882"/>

  <!-- Laptop base -->
  <rect x="155" y="220" width="200" height="62" rx="8" fill="#e2e8f0"/>
  <rect x="160" y="225" width="190" height="52" rx="6" fill="#1a202c"/>
  <!-- Screen glow -->
  <rect x="162" y="227" width="186" height="48" rx="5" fill="url(#purple)" opacity="0.15"/>
  <!-- Code lines on screen -->
  <rect x="172" y="237" width="80" height="4" rx="2" fill="#667eea" opacity="0.8"/>
  <rect x="172" y="247" width="120" height="4" rx="2" fill="#764ba2" opacity="0.6"/>
  <rect x="172" y="257" width="60" height="4" rx="2" fill="#667eea" opacity="0.5"/>
  <rect x="172" y="267" width="100" height="4" rx="2" fill="#ff6b9d" opacity="0.7"/>
  <!-- Heart on screen -->
  <g transform="translate(308, 235)" opacity="0.9">
    <path d="M14 5 C14 2.2 11.8 0 9 0 C7.6 0 6.4 0.6 5.5 1.5 C4.6 0.6 3.4 0 2 0 C-0.8 0 -3 2.2 -3 5 C-3 9 5.5 14 5.5 14 C5.5 14 14 9 14 5Z" fill="#ff6b9d"/>
  </g>
  <!-- Laptop hinge -->
  <rect x="155" y="278" width="200" height="6" rx="3" fill="#cbd5e0"/>
  <!-- Laptop keyboard base -->
  <rect x="145" y="278" width="220" height="12" rx="4" fill="#e2e8f0"/>

  <!-- Notebook -->
  <rect x="330" y="200" width="90" height="82" rx="6" fill="white" filter="url(#shadow)"/>
  <rect x="330" y="200" width="10" height="82" rx="3" fill="url(#purple)"/>
  <!-- Lines in notebook -->
  <line x1="348" y1="220" x2="410" y2="220" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="348" y1="232" x2="410" y2="232" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="348" y1="244" x2="400" y2="244" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="348" y1="256" x2="405" y2="256" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Small heart in notebook -->
  <g transform="translate(356, 262)" opacity="0.6">
    <path d="M8 3C8 1.3 6.7 0 5 0C4.2 0 3.5 0.3 3 0.8C2.5 0.3 1.8 0 1 0C-0.7 0 -2 1.3 -2 3C-2 5.5 3 8.5 3 8.5C3 8.5 8 5.5 8 3Z" fill="#ff6b9d"/>
  </g>
  <!-- Notebook rings -->
  <circle cx="343" cy="215" r="4" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="343" cy="240" r="4" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="343" cy="265" r="4" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Pen -->
  <g transform="translate(415, 195) rotate(35)">
    <rect x="0" y="0" width="8" height="55" rx="4" fill="url(#purple)"/>
    <polygon points="0,55 8,55 4,68" fill="#4a5568"/>
    <rect x="0" y="0" width="8" height="10" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- Person (sitting) -->
  <!-- Chair -->
  <rect x="196" y="300" width="110" height="8" rx="4" fill="#a0aec0"/>
  <rect x="196" y="308" width="8" height="40" rx="3" fill="#a0aec0"/>
  <rect x="298" y="308" width="8" height="40" rx="3" fill="#a0aec0"/>

  <!-- Body -->
  <rect x="218" y="210" width="66" height="90" rx="20" fill="#fbd5a5"/>

  <!-- Shirt -->
  <rect x="215" y="240" width="72" height="60" rx="14" fill="url(#purple)"/>

  <!-- Head -->
  <ellipse cx="251" cy="200" rx="32" ry="34" fill="#fbd5a5"/>

  <!-- Hair -->
  <ellipse cx="251" cy="175" rx="32" ry="16" fill="#4a3728"/>
  <rect x="219" y="175" width="64" height="20" rx="0" fill="#4a3728"/>
  <!-- Hair sides -->
  <ellipse cx="221" cy="195" rx="8" ry="14" fill="#4a3728"/>
  <ellipse cx="281" cy="195" rx="8" ry="14" fill="#4a3728"/>

  <!-- Eyes -->
  <ellipse cx="240" cy="200" rx="5" ry="6" fill="white"/>
  <ellipse cx="262" cy="200" rx="5" ry="6" fill="white"/>
  <circle cx="241" cy="201" r="3" fill="#2d3748"/>
  <circle cx="263" cy="201" r="3" fill="#2d3748"/>
  <!-- Eye shine -->
  <circle cx="242" cy="200" r="1" fill="white"/>
  <circle cx="264" cy="200" r="1" fill="white"/>

  <!-- Smile -->
  <path d="M242 213 Q251 220 260 213" stroke="#c05621" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="232" cy="210" rx="7" ry="4" fill="#ffb3ba" opacity="0.5"/>
  <ellipse cx="270" cy="210" rx="7" ry="4" fill="#ffb3ba" opacity="0.5"/>

  <!-- Arms -->
  <!-- Left arm reaching to keyboard -->
  <path d="M218 255 Q190 268 175 275" stroke="#fbd5a5" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Right arm reaching to keyboard -->
  <path d="M283 255 Q310 268 325 275" stroke="#fbd5a5" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Floating envelope (result of work) -->
  <g transform="translate(88, 90)">
    <rect width="72" height="52" rx="6" fill="white" stroke="#667eea" stroke-width="2"/>
    <path d="M0 4 L36 32 L72 4" stroke="#667eea" stroke-width="2" fill="none"/>
    <!-- Heart on envelope -->
    <g transform="translate(28, 28)" opacity="0.8">
      <path d="M8 3C8 1.3 6.7 0 5 0C4.2 0 3.5 0.3 3 0.8C2.5 0.3 1.8 0 1 0C-0.7 0 -2 1.3 -2 3C-2 5.5 3 8.5 3 8.5C3 8.5 8 5.5 8 3Z" fill="#ff6b9d"/>
    </g>
    <!-- Stars on envelope -->
    <text x="10" y="42" font-size="10" opacity="0.6">✨</text>
  </g>
  <!-- Envelope shadow/float lines -->
  <line x1="124" y1="150" x2="124" y2="142" stroke="#667eea" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Floating star badge -->
  <g transform="translate(370, 145)">
    <circle r="26" cx="26" cy="26" fill="url(#purple)" opacity="0.12"/>
    <circle r="20" cx="26" cy="26" fill="url(#purple)" opacity="0.2"/>
    <text x="26" y="33" text-anchor="middle" font-size="22">⭐</text>
  </g>

  <!-- Bottom dots decoration -->
  <circle cx="170" cy="360" r="4" fill="#667eea" opacity="0.2"/>
  <circle cx="185" cy="360" r="4" fill="#667eea" opacity="0.2"/>
  <circle cx="200" cy="360" r="4" fill="#667eea" opacity="0.2"/>
  <circle cx="320" cy="360" r="4" fill="#764ba2" opacity="0.2"/>
  <circle cx="335" cy="360" r="4" fill="#764ba2" opacity="0.2"/>
  <circle cx="350" cy="360" r="4" fill="#764ba2" opacity="0.2"/>
</svg>
